# Reusable Node.js CI workflow
name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      runs-on:
        type: string
        default: ubuntu-latest
      package-manager:
        type: string
        default: npm

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: |
          case "${{ inputs.package-manager }}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen ;;
          esac

      - name: Build
        run: npm run build --if-present

      - name: Type Check
        run: npm run type-check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Audit dependencies (npm)
        if: inputs.package-manager == 'npm'
        run: npm audit --audit-level=high

      - name: Audit dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm audit --audit-level high || true

      - name: OSV Scanner
        uses: google/osv-scanner-action@456ceb78310755116e0a3738121351006286b797 # v2.2.1
        with:
          scan-args: . --recursive

  coverage:
    needs: build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: |
          case "${{ inputs.package-manager }}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen ;;
          esac

      - name: Coverage
        run: npm run test:coverage --if-present
        env:
          CI: true
